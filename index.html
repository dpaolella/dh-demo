const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(P.i)},key,bytes(DATA));
  const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  try{sessionStorage.setItem('dh-demo-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),msg=document.getElementById('msg'),go=document.getElementById('go');
async function attempt(pw,quiet){
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){msg.textContent='This browser is too old to open the demo. Try a current version of Chrome, Edge, Firefox or Safari.';return}
  go.disabled=true;go.textContent='Opening…';
  try{await unlock(pw)}catch(e){go.disabled=false;go.textContent='Open the demo';if(!quiet)msg.textContent='That password did not work. Check it and try again.';try{sessionStorage.removeItem('dh-demo-pw')}catch(e){}}
}
f.addEventListener('submit',e=>{e.preventDefault();msg.textContent='';attempt(document.getElementById('pw').value.trim())});
let saved=null;try{saved=sessionStorage.getItem('dh-demo-pw')}catch(e){}
if(saved)attempt(saved,true);
})();
